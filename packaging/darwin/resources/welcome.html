<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font-family:-apple-system,sans-serif;padding:24px;line-height:1.7;color:#183e36}h1{font-size:26px}</style><h1>欢迎安装 MyGittu</h1><p>轻松管理 Git 仓库、查看差异并提交更改。</p><p>此安装包同时支持 Intel 和 Apple 芯片，无需选择处理器版本。</p><p>安装后，请从“应用程序”打开 MyGittu。运行前需安装系统 Git。应用默认使用简体中文，可在设置中切换为英文。</p><p>本开发预览版暂未启用 Finder 扩展。</p></html>
