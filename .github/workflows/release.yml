name: Build installers and release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match VERSION'; exit 1; }
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null
          else
            python3 scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "MyGittu $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Tests
        run: |
          go mod verify
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install NSIS
        run: choco upgrade nsis --no-progress -y
      - name: Test Explorer restart paths
        run: ./packaging/windows/test-restart-explorer.ps1
      - name: Build Chinese multi-architecture installer
        env:
          MYGITTU_CERT_BASE64: ${{ secrets.MYGITTU_CERT_BASE64 }}
          MYGITTU_CERT_PASSWORD: ${{ secrets.MYGITTU_CERT_PASSWORD }}
        run: |
          if ($env:MYGITTU_CERT_BASE64) {
            $env:MYGITTU_CERT_PATH = Join-Path $env:RUNNER_TEMP 'mygittu-publisher.pfx'
            [IO.File]::WriteAllBytes($env:MYGITTU_CERT_PATH, [Convert]::FromBase64String($env:MYGITTU_CERT_BASE64))
            $password = ConvertTo-SecureString $env:MYGITTU_CERT_PASSWORD -AsPlainText -Force
            $cert = (Get-PfxData -FilePath $env:MYGITTU_CERT_PATH -Password $password).EndEntityCertificates[0]
            if ($cert.Subject -eq $cert.Issuer) {
              New-Item -ItemType Directory -Force dist/release | Out-Null
              $public = Export-Certificate -Cert $cert -FilePath dist/release/MyGittu-Windows-Publisher.cer
              Import-Certificate -FilePath $public.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            }
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            throw 'Windows release signing certificate is missing'
          }
          try {
            ./packaging/windows/release.ps1 -Version '${{ needs.version.outputs.value }}'
          } finally {
            if ($env:MYGITTU_CERT_PATH) {
              Remove-Item -LiteralPath $env:MYGITTU_CERT_PATH -ErrorAction SilentlyContinue
            }
          }
      - name: Native COM smoke test
        run: |
          & ./.work/release-amd64/Release/MyGittuShellSmoke.exe "$pwd/dist/windows/x64/MyGittuShell.dll" "$pwd" 0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install and launch on Windows x64
        run: ./packaging/windows/smoke-install.ps1 -Installer 'dist/release/MyGittu-${{ needs.version.outputs.value }}-Windows-Setup.exe'
      - name: Upload Windows release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist/release -File | Where-Object Extension -in '.exe','.cer' | ForEach-Object FullName)
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Tests
        run: |
          go mod verify
          go test ./...
          go vet ./...
      - name: Build Chinese Universal installer
        env:
          MACOS_CERT_BASE64: ${{ secrets.MYGITTU_MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MYGITTU_MACOS_CERT_PASSWORD }}
          MYGITTU_APP_GROUP: ${{ vars.MYGITTU_MACOS_APP_GROUP }}
          SIGN_IDENTITY: ${{ vars.MYGITTU_MACOS_SIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERT_BASE64$MACOS_CERT_PASSWORD$MYGITTU_APP_GROUP$SIGN_IDENTITY" ]]; then
            bash packaging/darwin/release.sh '${{ needs.version.outputs.value }}'
            exit 0
          fi
          : "${MACOS_CERT_BASE64:?Missing Developer ID Application certificate}"
          : "${MACOS_CERT_PASSWORD:?Missing certificate password}"
          : "${MYGITTU_APP_GROUP:?Missing macOS App Group}"
          : "${SIGN_IDENTITY:?Missing macOS signing identity}"
          cert="$RUNNER_TEMP/mygittu-signing.p12"
          keychain="$RUNNER_TEMP/mygittu-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          trap 'rm -f "$cert"; security delete-keychain "$keychain" || true' EXIT
          printf '%s' "$MACOS_CERT_BASE64" | base64 -D > "$cert"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          bash packaging/darwin/release.sh '${{ needs.version.outputs.value }}'
      - name: Install and launch on Apple Silicon
        run: bash packaging/darwin/smoke-install.sh
      - name: Upload macOS release file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/release/*.pkg --clobber
  windows-arm64-install:
    needs: [version, windows]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows installer from draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:GITHUB_REF_NAME --pattern '*.exe' --dir dist/release
      - name: Install and launch on Windows ARM64
        run: ./packaging/windows/smoke-install.ps1 -Installer 'dist/release/MyGittu-${{ needs.version.outputs.value }}-Windows-Setup.exe'
  macos-intel-install:
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS installer from draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.pkg' --dir dist/release
      - name: Install and launch on Intel
        run: bash packaging/darwin/smoke-install.sh
  publish:
    needs: [windows-arm64-install, macos-intel-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.exe' --pattern '*.pkg' --pattern '*.cer' --dir release
          shopt -s nullglob
          (cd release && sha256sum *.exe *.pkg *.cer > SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
